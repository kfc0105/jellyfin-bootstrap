# Jellyfin and the library apps start with `docker compose up`.
# Gluetun, qBittorrent, and Prowlarr start only with `--profile vpn`,
# which bootstrap.sh adds once WIREGUARD_PRIVATE_KEY is set.
#
# qBittorrent and Prowlarr use Gluetun's network namespace. They have no
# network of their own, so other containers reach them at the hostname `gluetun`.

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${JELLYFIN_PORT:-8096}:8096"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config
      - ${MEDIA_ROOT:-./media}:/media:ro

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${RADARR_PORT:-7878}:7878"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${MEDIA_ROOT:-./media}/downloads:/downloads
      - ${MEDIA_ROOT:-./media}/movies:/movies

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SONARR_PORT:-8989}:8989"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${MEDIA_ROOT:-./media}/downloads:/downloads
      - ${MEDIA_ROOT:-./media}/series:/series

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BAZARR_PORT:-6767}:6767"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/bazarr:/config
      - ${MEDIA_ROOT:-./media}/movies:/movies
      - ${MEDIA_ROOT:-./media}/series:/series

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SEERR_PORT:-5055}:5055"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/seerr:/app/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5055/api/v1/settings/public"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  gluetun:
    profiles: ["vpn"]
    image: ghcr.io/qdm12/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      # qBittorrent rejects the WebUI when the port in the browser's Host header
      # differs from the port it listens on, so both sides of this mapping match.
      - "${BIND_ADDRESS:-0.0.0.0}:${QBITTORRENT_PORT:-8090}:${QBITTORRENT_PORT:-8090}"
      # Prowlarr listens on 9696 inside this network namespace.
      - "${BIND_ADDRESS:-0.0.0.0}:${PROWLARR_PORT:-9696}:9696"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-United States}
      - DNS_SERVER=true
    volumes:
      - ${CONFIG_ROOT:-./config}/vpn:/config
    healthcheck:
      test: ["CMD-SHELL", "ip -4 -o addr show dev tun0 | grep -q inet"]
      start_period: 30s
      timeout: 3s
      interval: 5s
      retries: 60

  prowlarr:
    profiles: ["vpn"]
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config

  qbittorrent:
    profiles: ["vpn"]
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/wait-tunnel.sh"]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_USERNAME=${QBITTORRENT_USERNAME:-admin}
      - WEBUI_PASSWORD=${QBITTORRENT_PASSWORD:-}
      - WEBUI_PORT=${QBITTORRENT_PORT:-8090}
      - XDG_DOWNLOAD_DIR=/downloads
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${MEDIA_ROOT:-./media}/downloads:/downloads
      - ./scripts/wait-tunnel.sh:/usr/local/bin/wait-tunnel.sh:ro
